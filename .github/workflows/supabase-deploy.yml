name: Supabase – wdrożenie serwera analizy

# Wdraża funkcję supabase/functions/calai i ustawia jej sekret ANTHROPIC_API_KEY.
# Potrzebne sekrety repozytorium: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, ANTHROPIC_API_KEY.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Sprawdź sekrety
        run: |
          missing=0
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF ANTHROPIC_API_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Brak sekretu $v (Settings → Secrets and variables → Actions)."; missing=1; fi
          done
          exit $missing

      - uses: actions/checkout@v6

      - uses: supabase/setup-cli@v3
        with:
          version: 2.121.0

      - name: Ustaw klucz Anthropic jako sekret funkcji
        run: |
          printf 'ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_API_KEY" > "$RUNNER_TEMP/fn.env"
          supabase secrets set --env-file "$RUNNER_TEMP/fn.env" --project-ref "$SUPABASE_PROJECT_REF"
          rm -f "$RUNNER_TEMP/fn.env"

      - name: Wdróż funkcję calai
        run: supabase functions deploy calai --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api

      - name: Test działania (health)
        run: |
          URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/calai/health"
          for i in 1 2 3 4 5 6; do
            RES=$(curl -s -m 20 "$URL" || true)
            echo "$RES"
            if echo "$RES" | grep -q '"apiKeyConfigured":true'; then exit 0; fi
            sleep 10
          done
          echo "::error::Funkcja nie odpowiada poprawnie pod $URL"
          exit 1

      - name: Test analizy (prawdziwe zapytanie do Claude, obrazek bez jedzenia)
        run: |
          python3 - <<'PY'
          import base64, json, struct, urllib.request, urllib.error, zlib, os
          def chunk(t, d): return struct.pack('>I', len(d)) + t + d + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
          w = h = 64
          raw = b''.join(b'\x00' + b'\x30\x60\xc0' * w for _ in range(h))
          png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(raw)) + chunk(b'IEND', b'')
          url = f"https://{os.environ['SUPABASE_PROJECT_REF']}.supabase.co/functions/v1/calai/analyze"
          req = urllib.request.Request(url, data=json.dumps({'imageBase64': base64.b64encode(png).decode()}).encode(), headers={'Content-Type': 'application/json'})
          try:
              status, body = 200, json.load(urllib.request.urlopen(req, timeout=150))
          except urllib.error.HTTPError as e:
              status, body = e.code, json.load(e)
          print(status, json.dumps(body, ensure_ascii=False)[:500])
          code = (body.get('error') or {}).get('code')
          # Dla jednolitego obrazka oczekujemy odpowiedzi modelu (NO_FOOD/UNREADABLE) albo wyniku – to znaczy, że klucz i zapytanie działają.
          if status == 200 or code in ('NO_FOOD', 'UNREADABLE'):
              print('OK: serwer poprawnie rozmawia z Claude')
          else:
              print(f'::error::Analiza nie działa: {code}')
              raise SystemExit(1)
          PY

      - name: Test analizy opisu (prawdziwe zapytanie do Claude, bez zdjęcia)
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          url = f"https://{os.environ['SUPABASE_PROJECT_REF']}.supabase.co/functions/v1/calai/analyze"
          req = urllib.request.Request(url, data=json.dumps({'text': 'dwa jajka sadzone i kromka chleba'}).encode(), headers={'Content-Type': 'application/json'})
          try:
              status, body = 200, json.load(urllib.request.urlopen(req, timeout=150))
          except urllib.error.HTTPError as e:
              status, body = e.code, json.load(e)
          print(status, json.dumps(body, ensure_ascii=False)[:500])
          if status != 200 or not body.get('items'):
              print('::error::Analiza opisu nie działa')
              raise SystemExit(1)
          print(f"OK: {body['mealName']} – {body['totals']['kcal']} kcal")
          PY

      - name: Test kodu kreskowego (Open Food Facts)
        run: |
          URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/calai/product/3017620422003"
          RES=$(curl -s -m 30 "$URL")
          echo "$RES" | head -c 400; echo
          echo "$RES" | python3 -c "import json,sys; d=json.load(sys.stdin); k=d['items'][0]['per100g']['kcal']; assert 400 < k < 650, k; print('OK:', d['mealName'], k, 'kcal/100 g')"

      - name: Test odczytu etykiety (prawdziwe zapytanie do Claude)
        run: |
          IM=$(command -v magick || command -v convert || true)
          if [ -z "$IM" ]; then sudo apt-get install -y -qq imagemagick >/dev/null; IM=$(command -v magick || command -v convert); fi
          "$IM" -size 700x520 xc:white -fill black -font DejaVu-Sans -pointsize 30 \
            -annotate +30+60 "Płatki owsiane" \
            -annotate +30+120 "Wartość odżywcza w 100 g" \
            -annotate +30+180 "Wartość energetyczna  1550 kJ / 370 kcal" \
            -annotate +30+240 "Tłuszcz  7,0 g" \
            -annotate +30+300 "Węglowodany  60 g" \
            -annotate +30+360 "Białko  13 g" \
            -annotate +30+440 "Masa netto: 500 g" label.png
          python3 - <<'PY'
          import base64, json, os, urllib.request, urllib.error
          url = f"https://{os.environ['SUPABASE_PROJECT_REF']}.supabase.co/functions/v1/calai/analyze"
          data = json.dumps({'imageBase64': base64.b64encode(open('label.png', 'rb').read()).decode(), 'mode': 'label'}).encode()
          req = urllib.request.Request(url, data=data, headers={'Content-Type': 'application/json'})
          try:
              status, body = 200, json.load(urllib.request.urlopen(req, timeout=150))
          except urllib.error.HTTPError as e:
              status, body = e.code, json.load(e)
          print(status, json.dumps(body, ensure_ascii=False)[:500])
          per = body['items'][0]['per100g'] if status == 200 else {}
          if status != 200 or not (360 <= per.get('kcal', 0) <= 380) or body.get('portions', {}).get('package') != 500:
              print('::error::Odczyt etykiety nie działa poprawnie')
              raise SystemExit(1)
          print('OK: etykieta odczytana', per)
          PY
