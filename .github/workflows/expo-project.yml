name: Expo – połącz projekt z expo.dev

# Tworzy projekt na expo.dev (lub łączy istniejący o tym samym slugu) na koncie,
# do którego należy sekret EXPO_TOKEN, i zapisuje projectId w app.json.
# Uruchamia się automatycznie po zmianie tego pliku albo ręcznie z zakładki Actions.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/expo-project.yml']

permissions:
  contents: write

concurrency:
  group: expo-project
  cancel-in-progress: false

env:
  EAS_CLI: eas-cli@25.1.1

jobs:
  link:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Sprawdź sekret EXPO_TOKEN
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Brak sekretu EXPO_TOKEN. Dodaj go w Settings → Secrets and variables → Actions → New repository secret (nazwa dokładnie EXPO_TOKEN)."
            exit 1
          fi

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Konto Expo powiązane z tokenem
        run: npx --yes "$EAS_CLI" whoami

      - name: Czy projekt jest już połączony?
        id: check
        run: |
          if node -e 'const a=require("./app.json"); process.exit(a.expo?.extra?.eas?.projectId ? 0 : 1)'; then
            echo "linked=true" >> "$GITHUB_OUTPUT"
          else
            echo "linked=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Utwórz lub połącz projekt na expo.dev
        if: steps.check.outputs.linked == 'false'
        run: npx --yes "$EAS_CLI" init --non-interactive --force

      - name: Zapisz projectId w repozytorium
        if: steps.check.outputs.linked == 'false'
        run: |
          if git diff --quiet -- app.json; then
            echo "::error::eas init nie zmienił app.json – sprawdź log powyżej."
            exit 1
          fi
          git diff -- app.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.json
          git commit -m "Link Expo project on expo.dev (eas init)"
          git push

      - name: Informacje o projekcie
        run: npx --yes "$EAS_CLI" project:info
